let currentPair = 'AUDJPY';
let currentTF = 'D1';
let chart = null;
let series = null;

function render() {
  document.getElementById('chart').innerHTML = '';
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    width: document.getElementById('chart').clientWidth,
    height: document.getElementById('chart').clientHeight,
    layout: { background: { type: 'solid', color: '#131722' }, textColor: '#d1d4dc' },
    grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
    crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    rightPriceScale: { borderColor: '#363a45' },
    timeScale: { borderColor: '#363a45', timeVisible: false },
  });

  series = chart.addCandlestickSeries({
    upColor: '#26a69a', downColor: '#ef5350',
    borderUpColor: '#26a69a', borderDownColor: '#ef5350',
    wickUpColor: '#26a69a', wickDownColor: '#ef5350',
  });

  const data = datasets[currentPair]?.[currentTF] || datasets[currentPair]?.['D1'] || [];
  series.setData(data);

  if (markers_map[currentPair]?.[currentTF]) {
    series.setMarkers(markers_map[currentPair][currentTF]);
  }

  if (lines_map[currentPair]?.[currentTF]) {
    lines_map[currentPair][currentTF].forEach(l => {
      series.createPriceLine(l);
    });
  }

  chart.timeScale().fitContent();

  document.querySelectorAll('.pair-btn').forEach(b => b.classList.toggle('active', b.textContent === currentPair));
  document.querySelectorAll('.tf-btn').forEach(b => b.classList.toggle('active', b.textContent === currentTF));
}

function switchPair(p) { currentPair = p; currentTF = 'D1'; render(); }
function switchTF(tf) { currentTF = tf; render(); }

render();
window.addEventListener('resize', () => { if(chart) chart.applyOptions({ width: document.getElementById('chart').clientWidth }); });
